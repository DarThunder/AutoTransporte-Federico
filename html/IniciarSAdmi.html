<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Rutero</title>
  <link rel="stylesheet" href="../css/style.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<div class="container-login">
    <div class="left-img"></div>

    <div class="right-form">
        <div class="form-box">
            <div class="logo-img">
                <img src="../images/Logo1.jpg" alt="El RuteroLogo" />
            </div>
            <div class="admin-title">ADMINISTRADOR</div>

            <form>
                <div class="mb-3">
                    <label for="usuario">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="usuario" placeholder="admin12Gonza" required />
                        <i class="fa fa-user"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Introduce tu contraseña" required />
                        <i class="fa fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn-orange2">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</div>



  <footer>
    <p>© 2025 - Dard's Innovations</p>
  </footer>

 
</body>
</html>
