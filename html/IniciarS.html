<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Rutero</title>
  <link rel="stylesheet" href="../css/style-login.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<div class="container-login">
    <div class="left-img"></div>

    <div class="right-form">
        <div class="form-box">
            <div class="logo-img">
                <img src="/images/logo1.png" alt="El Rutero Logo" />
            </div>

            <!-- Formulario de acceso -->
            <form>
                <!-- Campo de usuario -->
                <div class="mb-3">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="alex@email.com" required />
                        <i class="fa fa-envelope"></i>
                    </div>
                </div>

                <!-- Campo de contraseña -->
                <div class="mb-3">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Introduce tu contraseña" required />
                        <i class="fa fa-lock"></i>
                    </div>
                </div>

                <div class="forgot">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de inicio de sesión -->
                <button type="submit" class="btn-orange1">Iniciar Sesión</button>

                <div class="divider-container">
                    <div class="divider-line"></div>
                    <div class="divider-text">O</div>
                    <div class="divider-line"></div>
                </div>

                <a href="RegistrarU.html" class="btn-register text-center d-block text-decoration-none">
                    Registrarse ahora
                </a>
                <a href="index.html" class="btn-return text-center d-block text-decoration-none">
                    Regresar
                </a>

            </form>
        </div>
    </div>
</div>




  <footer>
    <p>© 2025 - Dard's Innovations</p>
  </footer>

 
</body>
</html>
